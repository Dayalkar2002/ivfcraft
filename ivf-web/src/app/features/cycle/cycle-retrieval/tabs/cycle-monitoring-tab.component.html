@if (loading) {
  <p class="tab-loading">Loading monitoring chart...</p>
} @else {
  <form [formGroup]="form" class="tab-form">
    <section class="tab-section monitoring-section" formGroupName="day0">
      <h3>Cycle Day 0 Entry</h3>
      <div class="field-grid cols-4">
        <label>Day #0 Date<input type="date" formControlName="date" /></label>
        <label>FSH Drug #1
          <select formControlName="fshDrug1">
            <option [ngValue]="0">Select</option>
            @for (d of masters.fshDrugs; track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
          </select>
        </label>
        <label>Dose<input type="number" formControlName="fshDrug1Dose" /></label>
        <label>FSH Drug #2
          <select formControlName="fshDrug2">
            <option [ngValue]="0">Select</option>
            @for (d of masters.fshDrugs; track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
          </select>
        </label>
        <label>Dose<input type="number" formControlName="fshDrug2Dose" /></label>
        <label>HMG Drug #1
          <select formControlName="hmgDrug1">
            <option [ngValue]="0">Select</option>
            @for (d of masters.hmgDrugs; track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
          </select>
        </label>
        <label>Dose<input type="number" formControlName="hmgDrug1Dose" /></label>
        <label>HMG Drug #2
          <select formControlName="hmgDrug2">
            <option [ngValue]="0">Select</option>
            @for (d of masters.hmgDrugs; track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
          </select>
        </label>
        <label>Dose<input type="number" formControlName="hmgDrug2Dose" /></label>
        <label>Clomiphene
          <select formControlName="cloDrug1">
            <option [ngValue]="0">Select</option>
            @for (d of masters.cloDrugs; track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
          </select>
        </label>
        <label>Dose<input type="number" formControlName="cloDrug1Dose" /></label>
        <label>Antagonist
          <select formControlName="antaDrug1">
            <option [ngValue]="0">Select</option>
            @for (d of masters.antaDrugs; track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
          </select>
        </label>
        <label>Dose<input type="number" formControlName="antaDrug1Dose" /></label>
        <label>Other Drug
          <select formControlName="othDrug1">
            <option [ngValue]="0">Select</option>
            @for (d of masters.otherDrugs; track d.id) { <option [ngValue]="d.id">{{ d.name }}</option> }
          </select>
        </label>
        <label>Dose<input type="number" formControlName="othDrug1Dose" /></label>
        <label>GnRHa<input type="number" formControlName="gnrha" /></label>
        <label>E2<input type="number" formControlName="e2" /></label>
        <label>LH<input type="number" formControlName="lh" /></label>
        <label>FSH<input type="number" formControlName="fsh" /></label>
        <label>TSH<input type="number" formControlName="tsh" /></label>
        <label>Prol<input type="number" formControlName="prol" /></label>
        <label>Prog<input type="number" formControlName="prog" /></label>
        <label class="span-2">Ultrasound<input type="text" formControlName="ultrasound" /></label>
        <label>Endometrium<input type="text" formControlName="endometrium" /></label>
        <label class="span-full">Remarks<textarea formControlName="remarks" rows="2"></textarea></label>
      </div>
    </section>

    <section class="tab-section remdays-section">
      <h3>Remaining Days</h3>
      <div class="remday-header">
        <span>Day</span><span>Date</span><span>FSH1</span><span>FSH2</span><span>HMG1</span><span>HMG2</span>
        <span>E2</span><span>LH</span><span>L Fol</span><span>R Fol</span><span>Endo</span><span>HCG</span><span>Remarks</span>
      </div>
      <div formArrayName="remDays">
        @for (row of remDays.controls; track $index; let i = $index) {
          <div class="remday-row" [formGroupName]="i">
            <input type="number" formControlName="day" />
            <input type="date" formControlName="date" />
            <input type="number" formControlName="fshDrug1" />
            <input type="number" formControlName="fshDrug2" />
            <input type="number" formControlName="hmgDrug1" />
            <input type="number" formControlName="hmgDrug2" />
            <input type="number" formControlName="e2" />
            <input type="number" formControlName="lh" />
            <input type="number" formControlName="follicleLeft" />
            <input type="number" formControlName="follicleRight" />
            <input type="text" formControlName="endometrium" />
            <input type="checkbox" formControlName="hcg" />
            <input type="text" formControlName="remarks" />
          </div>
        }
      </div>
      <button type="button" class="btn-add" (click)="addRemDay()">+ Add Day</button>
    </section>

    @if (error) { <div class="alert error">{{ error }}</div> }
    @if (success) { <div class="alert success">{{ success }}</div> }
    <div class="tab-actions">
      <button type="button" class="btn btn-save" (click)="save()" [disabled]="saving">Save Monitoring Chart</button>
    </div>
  </form>
}
